<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuniLoon Wind & Trajectory</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .wind-container { display: flex; flex-direction: row; gap: 20px; padding: 20px; height: calc(100vh - 80px); }
        .wind-sidebar { width: 340px; background: var(--bg-card); border-radius: 12px; box-shadow: var(--shadow); padding: 20px; overflow-y: auto; }
        .wind-map { flex: 1; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
        .wind-map #map { height: 100%; width: 100%; }
        .wind-metric { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border-color); }
        .wind-metric .label { color: var(--text-secondary); }
        .wind-metric .value { font-weight: 600; }
        .btn-predict { background: #ff6b35; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: 600; margin-top: 12px; }
        .btn-predict:hover { background: #e55a2b; }
        .btn-predict:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: #555; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 6px; }
        .btn-secondary:hover { background: #666; }
        .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
        .coord-input { display: flex; gap: 8px; margin: 8px 0; }
        .coord-input input { flex: 1; padding: 6px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-primary); color: var(--text-primary); }
        .history-controls { display: flex; gap: 8px; margin: 12px 0; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <h1><i class="fas fa-wind"></i> Wind & Trajectory</h1>
            </div>
            <div class="header-right">
                <a href="/" title="Main Dashboard" style="color: var(--text-secondary);"><i class="fas fa-arrow-left"></i></a>
            </div>
        </header>
        <div class="wind-container">
            <div class="wind-sidebar">
                <h2>Current Wind</h2>
                <div id="wind-info">
                    <div class="wind-metric"><span class="label">Speed</span><span class="value" id="wind-speed">—</span></div>
                    <div class="wind-metric"><span class="label">Direction</span><span class="value" id="wind-dir">—</span></div>
                    <div class="wind-metric"><span class="label">Confidence</span><span class="value" id="wind-conf">—</span></div>
                </div>
                
                <h2 style="margin-top:20px;">Start Position</h2>
                <div class="coord-input">
                    <input type="text" id="start-lat" placeholder="Latitude" value="35.8276">
                    <input type="text" id="start-lon" placeholder="Longitude" value="10.6402">
                </div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="btn-secondary" id="set-start-btn"><i class="fas fa-check"></i> Set Start</button>
                    <button class="btn-secondary" id="use-current-btn"><i class="fas fa-location-dot"></i> Use Current</button>
                    <button class="btn-secondary" id="set-from-map-btn"><i class="fas fa-map-pin"></i> Click Map</button>
                </div>
                <p style="font-size:11px; color:var(--text-secondary); margin-top:4px;">Click on the map or use the buttons to set start point.</p>

                <div class="history-controls">
                    <button class="btn-secondary" id="undo-btn" disabled><i class="fas fa-undo"></i> Undo</button>
                    <button class="btn-secondary" id="redo-btn" disabled><i class="fas fa-redo"></i> Redo</button>
                    <span style="font-size:12px; color:var(--text-secondary); margin-left:auto;" id="history-count">0/0</span>
                </div>

                <h2 style="margin-top:20px;">Prediction</h2>
                <div id="prediction-info">
                    <div class="wind-metric"><span class="label">Duration</span><span class="value" id="pred-duration">—</span></div>
                    <div class="wind-metric"><span class="label">Landing Lat</span><span class="value" id="pred-lat">—</span></div>
                    <div class="wind-metric"><span class="label">Landing Lon</span><span class="value" id="pred-lon">—</span></div>
                </div>
                <button class="btn-predict" id="predict-btn"><i class="fas fa-rocket"></i> Predict Trajectory</button>
                <p style="font-size:12px; color:var(--text-secondary); margin-top:12px;">
                    Uses current wind estimate from telemetry.
                </p>
            </div>
            <div class="wind-map">
                <div id="map"></div>
            </div>
        </div>
    </div>
    <script>
        // ------------------------- State -------------------------
        let map;
        let windArrow = null;
        let predictedPath = null;
        let landingMarker = null;
        let startMarker = null;
        let startLat = 35.8276;
        let startLon = 10.6402;

        // History for Undo/Redo
        let positionHistory = [];
        let historyIndex = -1; // -1 means no position set yet

        // DOM refs
        const DOM = {
            startLat: document.getElementById('start-lat'),
            startLon: document.getElementById('start-lon'),
            windSpeed: document.getElementById('wind-speed'),
            windDir: document.getElementById('wind-dir'),
            windConf: document.getElementById('wind-conf'),
            predDuration: document.getElementById('pred-duration'),
            predLat: document.getElementById('pred-lat'),
            predLon: document.getElementById('pred-lon'),
            predictBtn: document.getElementById('predict-btn'),
            setStartBtn: document.getElementById('set-start-btn'),
            useCurrentBtn: document.getElementById('use-current-btn'),
            setFromMapBtn: document.getElementById('set-from-map-btn'),
            undoBtn: document.getElementById('undo-btn'),
            redoBtn: document.getElementById('redo-btn'),
            historyCount: document.getElementById('history-count'),
        };

        // ------------------------- Map -------------------------
        function initWindMap() {
            const center = [35.8276, 10.6402];
            map = L.map('map').setView(center, 10);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                maxZoom: 19
            }).addTo(map);

            map.on('click', function(e) {
                const lat = e.latlng.lat;
                const lon = e.latlng.lng;
                setStartPosition(lat, lon, true); // push history
            });

            // Initial start marker
            setStartPosition(startLat, startLon, false); // no history push
        }

        // ------------------------- Wind Fetch -------------------------
        async function fetchWind() {
            try {
                const response = await fetch('/api/wind/current');
                const data = await response.json();
                if (data.error) {
                    DOM.windSpeed.textContent = '⚠️ ' + data.error;
                    return;
                }
                DOM.windSpeed.textContent = data.speed.toFixed(1) + ' m/s';
                DOM.windDir.textContent = data.direction.toFixed(0) + '°';
                DOM.windConf.textContent = (data.confidence * 100).toFixed(0) + '%';
                if (data.latitude && data.longitude) {
                    updateWindArrow(data);
                }
            } catch (e) {
                console.error(e);
            }
        }

        function updateWindArrow(data) {
            if (windArrow) map.removeLayer(windArrow);
            const lat = data.latitude || 35.8276;
            const lon = data.longitude || 10.6402;
            const speed = data.speed || 0;
            const direction = data.direction || 0;
            const arrowLength = Math.min(30, speed * 3 + 10);
            const angle = direction - 90;
            const icon = L.divIcon({
                html: `<div style="transform: rotate(${angle}deg); text-align: center; font-size: ${arrowLength}px; line-height: 1; color: #ff6b35;">↑</div>`,
                iconSize: [30, 30],
                className: 'wind-arrow'
            });
            windArrow = L.marker([lat, lon], { icon: icon }).addTo(map);
            windArrow.bindPopup(`Wind: ${speed.toFixed(1)} m/s from ${direction.toFixed(0)}°`);
        }

        // ------------------------- Start Position & History -------------------------
        function setStartPosition(lat, lon, pushHistory = true) {
            startLat = lat;
            startLon = lon;
            DOM.startLat.value = lat.toFixed(6);
            DOM.startLon.value = lon.toFixed(6);
            updateStartMarker(lat, lon);

            if (pushHistory) {
                // If we are not at the end of history, truncate future entries
                if (historyIndex < positionHistory.length - 1) {
                    positionHistory = positionHistory.slice(0, historyIndex + 1);
                }
                positionHistory.push({ lat, lon });
                historyIndex = positionHistory.length - 1;
                updateHistoryButtons();
            }
        }

        function updateStartMarker(lat, lon) {
            if (startMarker) map.removeLayer(startMarker);
            startMarker = L.marker([lat, lon], {
                icon: L.divIcon({ 
                    className: 'start-marker', 
                    html: '🚀', 
                    iconSize: [24, 24] 
                })
            }).addTo(map).bindPopup('Start Position');
        }

        function undoPosition() {
            if (historyIndex > 0) {
                historyIndex--;
                const pos = positionHistory[historyIndex];
                setStartPosition(pos.lat, pos.lon, false);
                updateHistoryButtons();
            }
        }

        function redoPosition() {
            if (historyIndex < positionHistory.length - 1) {
                historyIndex++;
                const pos = positionHistory[historyIndex];
                setStartPosition(pos.lat, pos.lon, false);
                updateHistoryButtons();
            }
        }

        function updateHistoryButtons() {
            DOM.undoBtn.disabled = (historyIndex <= 0);
            DOM.redoBtn.disabled = (historyIndex >= positionHistory.length - 1);
            DOM.historyCount.textContent = `${positionHistory.length > 0 ? historyIndex + 1 : 0}/${positionHistory.length}`;
        }

        // ------------------------- Prediction -------------------------
        async function predictTrajectory() {
            DOM.predictBtn.disabled = true;
            DOM.predictBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Predicting...';
            try {
                const lat = parseFloat(DOM.startLat.value) || startLat;
                const lon = parseFloat(DOM.startLon.value) || startLon;
                const response = await fetch('/api/predict/trajectory', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ lat: lat, lon: lon })
                });
                const data = await response.json();
                if (data.error) {
                    alert('Error: ' + data.error);
                    return;
                }
                DOM.predDuration.textContent = Math.round(data.duration / 60) + ' min';
                DOM.predLat.textContent = data.landing_lat.toFixed(4);
                DOM.predLon.textContent = data.landing_lon.toFixed(4);
                drawPredictedPath(data.trajectory);
                // Update start marker to the position used
                setStartPosition(lat, lon, true);
            } catch (e) {
                alert('Prediction failed: ' + e.message);
            } finally {
                DOM.predictBtn.disabled = false;
                DOM.predictBtn.innerHTML = '<i class="fas fa-rocket"></i> Predict Trajectory';
            }
        }

        function drawPredictedPath(trajectory) {
            if (predictedPath) map.removeLayer(predictedPath);
            if (landingMarker) map.removeLayer(landingMarker);
            const points = trajectory.map(p => [p.latitude, p.longitude]);
            predictedPath = L.polyline(points, {
                color: '#ff6b35',
                weight: 3,
                opacity: 0.6,
                dashArray: '8 4'
            }).addTo(map);
            const last = trajectory[trajectory.length - 1];
            landingMarker = L.marker([last.latitude, last.longitude], {
                icon: L.divIcon({ className: 'landing-marker', html: '🛬', iconSize: [24, 24] })
            }).addTo(map).bindPopup('Predicted Landing');
            map.fitBounds(predictedPath.getBounds(), { padding: [30, 30] });
        }

        // ------------------------- Event Listeners -------------------------
        DOM.predictBtn.addEventListener('click', predictTrajectory);

        DOM.setStartBtn.addEventListener('click', function() {
            const lat = parseFloat(DOM.startLat.value);
            const lon = parseFloat(DOM.startLon.value);
            if (!isNaN(lat) && !isNaN(lon)) {
                setStartPosition(lat, lon, true);
            } else {
                alert('Invalid coordinates');
            }
        });

        DOM.useCurrentBtn.addEventListener('click', function() {
            fetch('/api/telemetry/latest')
                .then(r => r.json())
                .then(data => {
                    if (data && data.latitude && data.longitude) {
                        setStartPosition(data.latitude, data.longitude, true);
                    } else {
                        alert('No current position available');
                    }
                })
                .catch(e => alert('Error fetching position: ' + e.message));
        });

        DOM.setFromMapBtn.addEventListener('click', function() {
            alert('Click on the map to set the start point!');
        });

        DOM.undoBtn.addEventListener('click', undoPosition);
        DOM.redoBtn.addEventListener('click', redoPosition);

        // ------------------------- Init -------------------------
        initWindMap();
        fetchWind();
        setInterval(fetchWind, 10000); // refresh every 10s

        // Initial history: add the default start position
        // We'll set it after map init
        setTimeout(() => {
            setStartPosition(startLat, startLon, true);
        }, 100);
    </script>
</body>
</html>
