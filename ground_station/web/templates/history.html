<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuniLoon Flight History</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .history-container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .flight-table { width: 100%; border-collapse: collapse; }
        .flight-table th, .flight-table td { padding: 10px; border-bottom: 1px solid var(--border-color); text-align: left; }
        .flight-table th { background: var(--card-header-bg); font-weight: 600; }
        .btn-pdf { background: #ff6b35; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-pdf:hover { background: #e55a2b; }
        .filter-row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-row input { padding: 6px 12px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-primary); color: var(--text-primary); }
        .no-flights { color: var(--text-secondary); padding: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <h1><i class="fas fa-history"></i> Flight History</h1>
            </div>
            <div class="header-right">
                <a href="/" title="Main Dashboard" style="color: var(--text-secondary);"><i class="fas fa-arrow-left"></i></a>
            </div>
        </header>
        <div class="history-container">
            <div class="filter-row">
                <input type="text" id="filter-date" placeholder="Filter by date..." />
                <input type="number" id="filter-alt-min" placeholder="Min altitude (m)" />
                <input type="number" id="filter-alt-max" placeholder="Max altitude (m)" />
                <button id="clear-filters" class="btn-pdf" style="background:#555;">Clear</button>
                
                
            </div>
            <div id="flight-list">
                <div class="no-flights">Loading flights...</div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='history.js') }}"></script>

    <script>
        document.getElementById('select-all').addEventListener('change', function() {
            document.querySelectorAll('.flight-check').forEach(cb => cb.checked = this.checked);
        });

        document.getElementById('compare-btn').addEventListener('click', function() {
            const selected = document.querySelectorAll('.flight-check:checked');
            const ids = Array.from(selected).map(cb => cb.value);
            if (ids.length < 2) {
                alert('Select at least 2 flights to compare.');
                return;
            }
            // Redirect to comparison page with IDs in query string
            window.location.href = '/compare?ids=' + ids.join(',');
        });
    </script>

    </script>
    </body>


</html>
