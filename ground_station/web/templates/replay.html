<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuniLoon Flight Replay</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .replay-container { padding: 20px; max-width: 1400px; margin: 0 auto; }
        .controls { display: flex; gap: 12px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
        .controls button { padding: 6px 16px; border: none; border-radius: 4px; background: #ff6b35; color: white; cursor: pointer; }
        .controls button:hover { background: #e55a2b; }
        .controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        .controls input[type="range"] { width: 200px; }
        .controls label { display: flex; align-items: center; gap: 8px; }
        .stats-bar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 16px; }
        .stat-card { background: var(--bg-card); padding: 12px; border-radius: 8px; text-align: center; box-shadow: var(--shadow); }
        .stat-label { font-size: 12px; color: var(--text-secondary); }
        .stat-value { font-size: 18px; font-weight: 700; }
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .map-card { grid-column: 1 / 2; grid-row: 1 / 3; min-height: 400px; }
        #map { height: 400px; width: 100%; }
        .details-card { grid-column: 2 / 3; grid-row: 1 / 2; }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; padding: 12px; }
        .detail-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border-color); }
        .graph-card { grid-column: span 1; min-height: 250px; }
        #altitude-graph, #temperature-graph { height: 240px; width: 100%; }
        .progress-container { margin: 12px 0; }
        .progress-bar { background: var(--bg-primary); border-radius: 8px; overflow: hidden; height: 10px; }
        .progress-fill { width: 0%; background: #ff6b35; height: 100%; transition: width 0.1s; }
        .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); }
        .file-upload { display: flex; gap: 12px; align-items: center; }
        .file-upload input[type="file"] { padding: 6px; border: 1px solid var(--border-color); border-radius: 4px; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge.online { background: rgba(0,200,83,0.15); color: #00c853; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <h1><i class="fas fa-undo-alt"></i> Flight Replay</h1>
                <span class="badge online" id="status-badge">● Ready</span>
            </div>
            <div class="header-right">
                <a href="/" title="Main Dashboard" style="color: var(--text-secondary);"><i class="fas fa-arrow-left"></i></a>
            </div>
        </header>
        <div class="replay-container">
            <!-- File Upload -->
            <div class="file-upload">
                <input type="file" id="csv-file" accept=".csv">
                <button id="load-btn">Load CSV</button>
                <span id="file-status">No file loaded</span>
            </div>
            <!-- Controls -->
            <div class="controls">
                <button id="play-btn"><i class="fas fa-play"></i> Play</button>
                <button id="pause-btn"><i class="fas fa-pause"></i> Pause</button>
                <button id="stop-btn"><i class="fas fa-stop"></i> Stop</button>
                <label>
                    Speed:
                    <input type="range" id="speed-slider" min="0.5" max="5" step="0.5" value="1">
                    <span id="speed-label">1x</span>
                </label>
                <span id="progress-text">0 / 0</span>
            </div>
            <!-- Progress Bar -->
            <div class="progress-container">
                <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
                <div class="progress-label"><span>0%</span><span id="progress-percent">0%</span></div>
            </div>
            <!-- Stats -->
            <div class="stats-bar" id="stats-bar">
                <div class="stat-card"><span class="stat-label">Altitude</span><span class="stat-value" id="stat-altitude">0 m</span></div>
                <div class="stat-card"><span class="stat-label">Latitude</span><span class="stat-value" id="stat-latitude">0.0000</span></div>
                <div class="stat-card"><span class="stat-label">Longitude</span><span class="stat-value" id="stat-longitude">0.0000</span></div>
                <div class="stat-card"><span class="stat-label">Temperature</span><span class="stat-value" id="stat-temperature">0.0 °C</span></div>
                <div class="stat-card"><span class="stat-label">Pressure</span><span class="stat-value" id="stat-pressure">0.0 hPa</span></div>
                <div class="stat-card"><span class="stat-label">Status</span><span class="stat-value" id="stat-status">—</span></div>
            </div>
            <!-- Map & Details -->
            <div class="main-grid">
                <div class="card map-card">
                    <div class="card-header"><span><i class="fas fa-map"></i> Flight Path</span></div>
                    <div id="map"></div>
                </div>
                <div class="card details-card">
                    <div class="card-header"><span><i class="fas fa-info-circle"></i> Telemetry</span></div>
                    <div class="details-grid" id="details-grid">
                        <div class="detail-item"><span class="detail-label">Time</span><span class="detail-value" id="detail-time">—</span></div>
                        <div class="detail-item"><span class="detail-label">Altitude</span><span class="detail-value" id="detail-alt">—</span></div>
                        <div class="detail-item"><span class="detail-label">Latitude</span><span class="detail-value" id="detail-lat">—</span></div>
                        <div class="detail-item"><span class="detail-label">Longitude</span><span class="detail-value" id="detail-lon">—</span></div>
                        <div class="detail-item"><span class="detail-label">Temperature</span><span class="detail-value" id="detail-temp">—</span></div>
                        <div class="detail-item"><span class="detail-label">Pressure</span><span class="detail-value" id="detail-press">—</span></div>
                        <div class="detail-item"><span class="detail-label">Humidity</span><span class="detail-value" id="detail-hum">—</span></div>
                        <div class="detail-item"><span class="detail-label">Status</span><span class="detail-value" id="detail-status">—</span></div>
                    </div>
                </div>
                <div class="card graph-card">
                    <div class="card-header"><span><i class="fas fa-arrow-up"></i> Altitude Profile</span></div>
                    <div id="altitude-graph"></div>
                </div>
                <div class="card graph-card">
                    <div class="card-header"><span><i class="fas fa-thermometer-half"></i> Temperature Profile</span></div>
                    <div id="temperature-graph"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='replay.js') }}"></script>
</body>
</html>
